    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --surface-hover: #1a1a24;
            --border: #1e1e2a;
            --text: #e4e4e7;
            --text-dim: #71717a;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.15);
            --radius: 12px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 720px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 16px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .logo span {
            color: var(--accent);
        }

        #rotButton {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        #rotButton:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        #rotButton:active {
            transform: scale(0.97);
        }

        #brainRotOutput {
            flex: 1;
            min-height: 0;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-y: hidden;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
            margin-bottom: 20px;
            text-align: justify;
            hyphens: auto;
        }

        #brainRotOutput:empty::before {
            content: 'Hit the button to rot your brain...';
            color: var(--text-dim);
            font-style: italic;
        }

        #tempDiv {
            position: absolute;
            visibility: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .container { padding: 0 14px; }
            header { padding: 14px 0 12px; }
            .logo { font-size: 16px; }
            #rotButton { font-size: 13px; padding: 8px 16px; }
            #brainRotOutput {
                padding: 16px;
                font-size: 14px;
                line-height: 1.65;
                border-radius: 10px;
                margin-bottom: 14px;
            }
        }
    </style>
</head>

                "but wait it gets worse", "and you won't believe this but",
                "because why not", "and that's when",
                "but the thing is", "so check this out",

            ],
            // ---- Relative clauses ----
            REL: [

                "who", "that", "which",
                // === Brainrot modifiers ===
                "who literally", "who lowkey", "that deadass",
                "which honestly", "who fr fr", "that unironically",

            ],
            // ---- Parenthetical asides (SCIgen-style) ----
            ASIDE: [

                "(cops called)", "(she cried)", "(he left)",
                "(must watch)", "(you won't believe this)",
                "(I'm shaking)", "(this is not a drill)",
                "(ASMR)", "(storytime)", "(part 47)",
                "(the sequel)", "(director's cut)",
                "(Subway Surfers gameplay below)",
                "(family guy funny moments)", "(watch till the end)",
                "(NPC behavior)", "(caught in 4k)", "(no cap)",
                "(still mogging)", "(he's actually cooked)",
                // === Escalation parentheticals ===
                "(gone sexual)", "(in the hood)", "(almost died)",
                "(he got jumped)", "(she snapped)", "(I almost got caught)",
                "(vomit warning)", "(blood warning)", "(cringe warning)",
                "(jumpscare warning)", "(18+ only)", "(viewer discretion advised)",
                "(banned from TikTok)", "(deleted scene)",
                "(the internet needs to see this)",
                // === Commentary parentheticals ===
                "(I'm so cooked for this)", "(help me)",
                "(why is this real)", "(this can't be real)",
                "(I need therapy)", "(someone call the police)",
                "(moms would not approve)", "(dad left after this)",
                "(the simulation is broken)", "(NPC behavior detected)",
                "(aura: DESTROYED)", "(aura: +1000000)",
                "(rizz level: MAXIMUM)", "(sigma status: ACHIEVED)",
                "(mewing streak: BROKEN)", "(Ohio moment)",
                "(certified brainrot)", "(peak internet)",
                "(we've peaked as a society)", "(there's no coming back from this)",
                "(this is why aliens won't visit us)",
                "(the CIA is watching this)",
                // === Meta / format parentheticals ===
                "(part 1 of 739)", "(finale)", "(lore drop)",
                "(canon)", "(not canon)", "(filler arc)",
                "(post-credit scene)", "(anime arc)",
                "(chapter 47: the reckoning)", "(season 3 episode 12)",
                "(DLC content)", "(patch notes)",
                "(Italian brainrot version)", "(Skibidi remix)",
            ],
            // ---- "According to" / attribution phrases ----
            ATTRIB: [
                // === Source-based attributions ===
                "According to my FYP,", "Based on the group chat lore,",
                "As the prophecy foretold,", "Sources (trust me bro) confirm",
                "Multiple TikTok analysts agree that",
                "The sigma grindset handbook states that",
                "A recent aura audit revealed that",

                "According to the brainrot archives,",

                // === Authority-based attributions ===
                "The Council of Sigma has determined that",
                "Per the International Rizz Committee,",

                "According to the Mog Bureau of Investigation,",
                "The Ohio Department of Brainrot reports that",
                "Leading gyatt scientists have concluded that",
                "The National Institute of Yapping states that",

                "The Fanum Tax Authority has declared that",
                "According to classified Backrooms intel,",
                "The Italian Brainrot Research Institute confirms that",
                "The Bombardiro Crocodilo Task Force reports that",
                // === Casual / meme attributions ===
                "My source is I made it up but",
                "Trust me bro,", "Chat I'm not lying,",
                "My FBI agent just texted me and said",
                "A little bird (actually a Tralalero Tralala) told me that",
                "The algorithm has spoken and it says",
                "Every single one of my brain cells agrees that",
                "The group chat has come to a unanimous decision that",
                "After consulting with exactly zero experts,",
                "I don't have proof but I don't have doubts either that",
                "The vibes suggest that", "My Roman Empire is the fact that",
                "Not to be a yapper but", "Not to be that person but",
                "Okay so storytime:", "So get this:",
                "You're not gonna believe this but",
            ],
            // ---- Concluding / consequence phrases ----
            CONSEQ: [
                // === Classic conclusions ===
                "and that's on period", "and everyone clapped",
                "which is lowkey iconic", "which explains the negative aura",
                "and the vibes were immaculate", "but the aura was non-recoverable",
                "causing a massive L", "resulting in a certified W",
                "leading to an aura explosion", "and nobody was surprised",
                "and chat went crazy", "which is giving main character energy",
                "and the group chat has not recovered since",
                "and honestly same", "and that's just facts",
                "which is why we can't have nice things",
                "and the timeline erupted", "but the FYP remained unbothered",
                "and it was lowkey the most sigma thing ever witnessed",
                // === Aura consequences ===
                "and the aura shift was seismic",
                "causing an aura deficit of -999999",
                "and the aura points were redistributed",
                "but the aura was already in the negatives",
                "resulting in permanent aura damage",
                "and the aura farm was destroyed",
                "leading to an aura bankruptcy filing",
                // === Dramatic conclusions ===
                "and that's how the Ohio incident started",
                "and the simulation crashed", "and the NPC broke character",
                "and the brainrot became self-aware",
                "and the backrooms expanded another level",
                "causing a rift in the sigma timeline",
                "and the Skibidi Toilet dimension collapsed",
                "and the Italian brainrot multiverse fractured",
                "and Bombardiro Crocodilo was summoned",
                "and Tung Tung Tung Sahur appeared",
                "and the Tralalero Tralala started running",
                // === Social media consequences ===
                "and the ratio was instantaneous",
                "and the post went viral for all the wrong reasons",
                "and the quote tweets were merciless",
                "and the comments section became a warzone",
                "and the screenshots were already in every group chat",
                "and the TikTok duets were unhinged",
                "and Twitter had a field day",
                "and Reddit wrote a thesis about it",
                "and the Discord server imploded",
                // === Existential / comedic conclusions ===
                "and at this point I don't even know anymore",
                "and honestly we deserve this",
                "and that's why the aliens haven't contacted us",
                "and the founding fathers are rolling in their graves",
                "and the simulation devs are considering a patch",
                "and nothing has been the same since",
                "and the copium reserves are depleted",
                "and there's no recovery from this",
                "and honestly? valid", "and honestly? mid",
                "and that's the last straw for this timeline",
                "and we are so cooked as a species",
                "and we are so back", "and it's so over",
                "and the W was massive", "and the L was historic",
                "but in the end it was kinda peak ngl",
            ],
          },
        };

        // =============================================================
        //  CFG ENGINE — SCIgen-inspired weighted productions
        //
        //  Grammar (simplified notation):
        //
        //  S → SIMPLE | COMPOUND | COMPLEX_SUBJ | COMPLEX_OBJ
        //    | QUESTION | INTERJECTED | ATTRIBUTED | COMPOUND_COMPLEX
        //
        //  SIMPLE     → CLAUSE (ADV_SENT)? (ASIDE)?
        //  COMPOUND   → CLAUSE, CONJ CLAUSE (CONSEQ)?
        //  COMPLEX_SUBJ → NP, REL VP_FRAG, VP_FRAG (PP)?
        //  COMPLEX_OBJ  → NP TV NP REL VP_FRAG (PP)?
        //  QUESTION   → Q_IS NP VP_BARE (PP)? (ASIDE)?
        //             | Q_DID NP VP_BARE (PP)? (ASIDE)?
        //  INTERJECTED → INTERJ CLAUSE (CONSEQ)?
        //  ATTRIBUTED  → ATTRIB CLAUSE (ASIDE)?
        //  COMPOUND_COMPLEX → CLAUSE, CONJ NP REL VP_FRAG, VP_FRAG
        //
        //  CLAUSE     → NP VP
        //  VP         → TV NP (PP)? | IV (PP)?
        //  VP_FRAG    → TV NP (PP)? | IV (PP)?       (no subject)
        //  VP_BARE    → TV_BARE NP | IV_BARE          (no auxiliary)
        //  NP         → (ADJ)? ENTITY
        //  ADV_SENT   → sentence-level adverb (at end)
        // =============================================================

        const B = L.brainrot;

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function maybe(fn, p = 0.4) { return Math.random() < p ? fn() : ''; }

        function oneOf(...fns) {
            const weights = fns.map(f => f.w || 1);
            const total = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * total;
            for (let i = 0; i < fns.length; i++) {
                r -= weights[i];
                if (r <= 0) return fns[i]();
            }
            return fns[fns.length - 1]();
        }

        function w(fn, weight) { fn.w = weight; return fn; }

        // ---- Leaf expansions ----

        // NP → (ADJ)? ENTITY
        // Handles article placement: "the goated Rizzler" not "goated the Rizzler"
        function NP() {
            const adj = maybe(() => pick(B.ADJ), 0.25);
            const ent = pick(B.ENTITY);
            if (!adj) return ent;
            // Insert adjective after article if entity starts with one
            const articleMatch = ent.match(/^(the |a |an )/i);
            if (articleMatch) {
                const article = articleMatch[1];
                const rest = ent.slice(article.length);
                return `${article}${adj} ${rest}`;
            }
            return `${adj} ${ent}`;
        }

        // ---- VP with subject (full clause) ----

        // Transitive: NP TV NP (PP)?
        function TRANS_CLAUSE() {
            const s = NP(), v = pick(B.TV), o = NP();
            const pp = maybe(() => pick(B.PP), 0.3);
            return pp ? `${s} ${v} ${o} ${pp}` : `${s} ${v} ${o}`;
        }

        // Intransitive: NP IV (PP)?
        function INTRANS_CLAUSE() {
            const s = NP(), v = pick(B.IV);
            const pp = maybe(() => pick(B.PP), 0.35);
            return pp ? `${s} ${v} ${pp}` : `${s} ${v}`;
        }

        // CLAUSE → TRANS_CLAUSE | INTRANS_CLAUSE
        function CLAUSE() {
            return oneOf(w(TRANS_CLAUSE, 3), w(INTRANS_CLAUSE, 2));
        }

        // ---- VP fragment (no subject) — for relative clauses ----

        function VP_FRAG_TRANS() {
            const v = pick(B.TV), o = NP();
            const pp = maybe(() => pick(B.PP), 0.25);
            return pp ? `${v} ${o} ${pp}` : `${v} ${o}`;
        }

        function VP_FRAG_INTRANS() {
            const v = pick(B.IV);
            const pp = maybe(() => pick(B.PP), 0.3);
            return pp ? `${v} ${pp}` : v;
        }

        function VP_FRAG() {
            return oneOf(w(VP_FRAG_TRANS, 3), w(VP_FRAG_INTRANS, 2));
        }

        // ---- Question-safe VP forms ----
        // "is"-questions need VP without leading "is":
        //   IV "is bussin" → "bussin", IV "is locked in" → "locked in"
        //   TV "is glazing" → "glazing"
        // "did"-questions need bare verb:
        //   TV "rizzes up" → "rizz up" (approximate)

        // For "is" questions, strip leading "is " from IV entries
        function IV_BARE_IS() {
            let v = pick(B.IV);
            // Strip leading "is " for copula/progressive forms
            if (v.startsWith('is ')) return v.slice(3);
            // For "has"/"goes"/"stays"/"just" forms, use as-is (they work after "did")
            return v;
        }

        function TV_BARE_IS() {
            let v = pick(B.TV);
            if (v.startsWith('is ')) return v.slice(3);
            return v;
        }

        // Split question openers by auxiliary type
        const Q_IS = [
            "Why is", "How is", "Bro why is", "Chat why is",
            "Nah why is", "Ayo how is", "Chat is", "Dawg why is",
            "Fam how is", "Wait why is", "Hold up why is",
            "What the sigma is", "What in the Ohio is",
            "What in the Skibidi Toilet is", "Why on god is",
            "Bro what in the actual brainrot is",
            "Why is no one talking about how",
        ];

        const Q_DID = [
            "When did", "Who let", "Why did", "Where did",
            "Fr why did", "Since when did", "Bro who let",
            "Nah who let", "Ayo who let", "Bruh how did",
            "Nah fr why did", "How in the Bombardiro Crocodilo did",
            "Why in the Italian brainrot did",
            "Since when could",
        ];

        const Q_RHETORICAL = [
            "Does anyone else think", "Can we talk about how",
            "Chat am I tweaking or is", "Is it just me or is",
            "Nah because why is", "Not gonna lie why is",
            "Chat can someone explain why",
        ];

        // ---- Sentence-level productions ----

        // SIMPLE → CLAUSE (ADV)? (ASIDE)?
        function S_SIMPLE() {
            const c = CLAUSE();
            const adv = maybe(() => pick(B.ADV), 0.18);
            const aside = maybe(() => pick(B.ASIDE), 0.12);
            let s = c;
            if (adv) s += `, ${adv}`;
            if (aside) s += ` ${aside}`;
            return s;
        }

        // COMPOUND → CLAUSE, CONJ CLAUSE (CONSEQ)?
        function S_COMPOUND() {
            const c1 = CLAUSE();
            const conj = pick(B.CONJ);
            const c2 = CLAUSE();
            const conseq = maybe(() => pick(B.CONSEQ), 0.22);
            let s = `${c1}, ${conj} ${c2}`;
            if (conseq) s += `, ${conseq}`;
            return s;
        }

        // COMPLEX (subject relative) → NP, REL VP_FRAG, VP_FRAG (PP)?
        //   "Kai Cenat, who lowkey mogs GigaChad, is locked in"
        function S_COMPLEX_SUBJ() {
            const subj = NP();
            const rel = pick(B.REL);
            const relVP = VP_FRAG();
            const mainVP = VP_FRAG();
            return `${subj}, ${rel} ${relVP}, ${mainVP}`;
        }

        // COMPLEX (object relative) → NP TV NP REL VP_FRAG
        //   "The Rizzler mogs Baby Gronk, who is bussin in Ohio"
        function S_COMPLEX_OBJ() {
            const subj = NP();
            const tv = pick(B.TV);
            const obj = NP();
            const rel = pick(B.REL);
            const relVP = VP_FRAG();
            return `${subj} ${tv} ${obj}, ${rel} ${relVP}`;
        }

        // QUESTION ("is" form) → Q_IS NP IV_BARE (PP)? (ASIDE)?
        //   "Why is Skibidi Toilet bussin in Ohio?"
        // Only uses intransitive VP (transitive goes through "did" questions)
        function S_QUESTION_IS() {
            const q = pick(Q_IS);
            const subj = NP();
            const vp = IV_BARE_IS();
            const pp = maybe(() => pick(B.PP), 0.3);
            const aside = maybe(() => pick(B.ASIDE), 0.15);
            let s = `${q} ${subj} ${vp}`;
            if (pp) s += ` ${pp}`;
            if (aside) s += ` ${aside}`;
            return s + '?';
        }

        // Deconjugate a single word from 3rd-person present to bare infinitive
        // Handles: "stares"→"stare", "rizzes"→"rizz", "catches"→"catch",
        //          "mogs"→"mog", "bodies"→"body", "does"→"do"
        function deconjWord(w) {
            if (w.length < 3) return w;
            if (w.endsWith('ies') && w.length > 4) return w.slice(0, -3) + 'y';

            if (w.endsWith('es') && w.length > 3) {
                const stripS = w.slice(0, -1);   // "stares" → "stare"
                const stripES = w.slice(0, -2);   // "rizzes" → "rizz"
                // If stripping just "s" gives a silent-e stem (vowel+consonant+e),
                // that's the correct base: "stare", "glaze", "flame", "expose"
                if (/[aeiou][^aeiou]e$/i.test(stripS)) return stripS;
                // Otherwise strip "es" for sibilant/o stems: "rizz", "catch", "do"
                return stripES;
            }

            if (w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us')) {
                return w.slice(0, -1);
            }
            return w;
        }

        // Deconjugate a transitive verb phrase from 3rd person to bare infinitive
        // "rizzes up" → "rizz up", "sigma stares at" → "sigma stare at"
        function deconjugateTV() {
            let tv = pick(B.TV);
            // Skip progressive forms ("is glazing") — can't follow "did"
            let attempts = 0;
            while (tv.startsWith('is ') && attempts++ < 5) tv = pick(B.TV);
            if (tv.startsWith('is ')) return 'mog';

            // Strip apostrophe suffixes: ratio'd → ratio, AMOG's → AMOG
            tv = tv.replace(/'[ds]\b/g, '');

            // Find and deconjugate the first word that looks like a 3rd-person verb
            const words = tv.split(' ');
            for (let i = 0; i < words.length; i++) {
                const w = words[i];
                if (w.length < 3) continue;
                // Check if this word looks conjugated (ends in s/es/ies)
                if (w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us')) {
                    words[i] = deconjWord(w);
                    break;
                }
            }
            return words.join(' ').trim();
        }

        // QUESTION ("did" form) → Q_DID NP TV_BASE NP (PP)?
        //   "Who let the Rizzler rizz up Baby Gronk at 3am?"
        function S_QUESTION_DID() {
            const q = pick(Q_DID);
            const subj = NP();
            const tv = deconjugateTV();
            const obj = NP();
            const pp = maybe(() => pick(B.PP), 0.25);
            let s = `${q} ${subj} ${tv} ${obj}`;
            if (pp) s += ` ${pp}`;
            return s + '?';
        }

        // QUESTION (rhetorical) → Q_RHETORICAL NP IV_BARE (PP)?
        // Most Q_RHETORICAL end with "is" or "how", so use bare IV form
        function S_QUESTION_RHET() {
            const q = pick(Q_RHETORICAL);
            const subj = NP();
            const vp = IV_BARE_IS();
            const pp = maybe(() => pick(B.PP), 0.3);
            let s = `${q} ${subj} ${vp}`;
            if (pp) s += ` ${pp}`;
            return s + '?';
        }

        // ATTRIBUTED → ATTRIB CLAUSE (ASIDE)?
        function S_ATTRIBUTED() {
            const attr = pick(B.ATTRIB);
            const clause = CLAUSE();
            const aside = maybe(() => pick(B.ASIDE), 0.18);
            return aside ? `${attr} ${clause} ${aside}` : `${attr} ${clause}`;
        }

        // INTERJECTED → INTERJ CLAUSE (CONSEQ)?
        function S_INTERJECTED() {
            const interj = pick(B.INTERJ);
            const clause = CLAUSE();
            const conseq = maybe(() => pick(B.CONSEQ), 0.2);
            return conseq ? `${interj} ${clause}, ${conseq}` : `${interj} ${clause}`;
        }

        // COMPOUND_COMPLEX → CLAUSE, CONJ NP, REL VP_FRAG, VP_FRAG
        function S_COMPOUND_COMPLEX() {
            const c1 = CLAUSE();
            const conj = pick(B.CONJ);
            const subj2 = NP();
            const rel = pick(B.REL);
            const relVP = VP_FRAG();
            const mainVP = VP_FRAG();
            return `${c1}, ${conj} ${subj2}, ${rel} ${relVP}, ${mainVP}`;
        }

        // NESTED COMPOUND → CLAUSE, CONJ CLAUSE, CONSEQ
        function S_NESTED() {
            const c1 = CLAUSE();
            const conj = pick(B.CONJ);
            const c2 = CLAUSE();
            const conseq = pick(B.CONSEQ);
            return `${c1}, ${conj} ${c2}, ${conseq}`;
        }

        // ---- Top-level sentence generator ----

        function generateSentence() {
            let s = oneOf(
                w(S_SIMPLE, 18),
                w(S_COMPOUND, 16),
                w(S_COMPLEX_SUBJ, 10),
                w(S_COMPLEX_OBJ, 10),
                w(S_ATTRIBUTED, 10),
                w(S_INTERJECTED, 12),
                w(S_QUESTION_IS, 7),
                w(S_QUESTION_DID, 5),
                w(S_QUESTION_RHET, 3),
                w(S_COMPOUND_COMPLEX, 5),
                w(S_NESTED, 4),
            );

            // Normalize whitespace
            s = s.replace(/\s+/g, ' ').trim();

            // Capitalize first letter
            s = s.charAt(0).toUpperCase() + s.slice(1);

            // Ensure terminal punctuation
            if (!/[.!?]$/.test(s)) s += '.';

            return s;
        }

        // =============================================================
        //  TEXT FILLING — fill the output box exactly like the original
        // =============================================================

        function generateTextUntilFull() {
            const output = document.getElementById('brainRotOutput');
            const tempDiv = document.getElementById('tempDiv');

            const style = window.getComputedStyle(output);
            tempDiv.style.width = style.width;
            tempDiv.style.padding = style.padding;
            tempDiv.style.fontSize = style.fontSize;
            tempDiv.style.lineHeight = style.lineHeight;
            tempDiv.style.fontFamily = style.fontFamily;

            let text = '';
            let safety = 0;
            const maxHeight = output.clientHeight;

            while (safety++ < 500) {
                const sentence = generateSentence();
                const candidate = text + (text ? ' ' : '') + sentence;
                tempDiv.textContent = candidate;
                if (tempDiv.scrollHeight > maxHeight) break;
                text = candidate;
            }

            output.textContent = text;
            output.classList.remove('fade-in');
            void output.offsetWidth;
            output.classList.add('fade-in');
        }

        // =============================================================
        //  EVENT LISTENERS
        // =============================================================

        document.getElementById('rotButton').addEventListener('click', generateTextUntilFull);

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (document.getElementById('brainRotOutput').textContent) {
                    generateTextUntilFull();
                }
            }, 200);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                generateTextUntilFull();
            }
        });
    })();
